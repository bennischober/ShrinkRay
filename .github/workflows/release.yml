name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run checks (the gate - ruff, mypy, tests)
        run: tools/gate.sh --no-cov

      - name: Build distributions
        run: uv build

      - name: Extract release notes from CHANGELOG
        run: uv run python tools/release_notes.py "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*

      - name: Upload artifacts (on failure for debugging)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  container:
    name: Build, smoke-test and publish the container image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build first WITHOUT pushing: the image must boot and answer the
      # healthcheck before anything reaches the registry (verify the artifact,
      # same rule the encodes follow — a zero exit code is not success)
      - name: Compute the image name (ghcr requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/$(echo ${GITHUB_REPOSITORY#*/} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build the runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Quality-measured video library compressor (ShrinkRay)
          load: true
          provenance: false
          # the toolchain layers (the HandBrake compile, ~4 min) are
          # deterministic given the pinned sources — cache them across runs so
          # a release build is cache-restore + uv sync + copy, not a fresh
          # compile (issue #165)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (one-shot CLI)
        # the entrypoint is `shrinkray` (issue #242): arguments must reach the
        # CLI, not be appended to `serve`
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ github.ref_name }} --help | grep -q "encode"
          docker run --rm ${{ env.IMAGE }}:${{ github.ref_name }} encode --help | grep -q -- "--dry-run"

      - name: Smoke-test the image (boot + healthcheck)
        run: |
          docker run -d --name smoke \
            -e SHRINKRAY_TOKEN=smoke-test-token \
            ${{ env.IMAGE }}:${{ github.ref_name }}
          # the image's own HEALTHCHECK answers /api/status; wait for it
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "image is healthy"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::smoke container never turned healthy (status: $status)"
          docker logs smoke 2>&1 | tail -20 || true
          exit 1

      - name: Smoke-test the image (runs as PUID/PGID)
        # issue #248: the server runs as the operator's user, takes over an
        # empty /data folder and writes its files as that user
        run: |
          data=$(mktemp -d)
          docker run -d --name smoke-user \
            -e SHRINKRAY_TOKEN=smoke-test-token -e PUID=4242 -e PGID=4243 \
            -v "$data:/data" \
            ${{ env.IMAGE }}:${{ github.ref_name }}
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke-user 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          # tolerant captures: a dead container must still print its logs below
          uid=$(docker exec smoke-user awk '/^Uid:/ {print $2}' /proc/1/status || echo none)
          owner=$(docker exec smoke-user stat -c '%u:%g' /data/config.json || echo none)
          # the console banner (issue #251): an interactive shell prints it, a
          # non-interactive exec keeps its output clean
          banner=$(printf 'exit\n' | script -qec "docker exec -it smoke-user sh" /dev/null | grep -c "ShrinkRay - the resident encoder is running" || true)
          plain=$(docker exec smoke-user sh -c 'echo clean' || echo none)
          docker logs smoke-user 2>&1 | tail -5
          docker rm -f smoke-user
          [ "$status" = "healthy" ] || { echo "::error::never turned healthy ($status)"; exit 1; }
          [ "$uid" = "4242" ] || { echo "::error::PID 1 runs as uid $uid, not 4242"; exit 1; }
          [ "$owner" = "4242:4243" ] || { echo "::error::/data/config.json is owned by $owner"; exit 1; }
          [ "$banner" = "1" ] || { echo "::error::an interactive console printed the banner $banner times"; exit 1; }
          [ "$plain" = "clean" ] || { echo "::error::a non-interactive exec printed '$plain'"; exit 1; }

      - name: Smoke-test the image (generated token)
        # issue #249: with no SHRINKRAY_TOKEN the server generates one into
        # /data/token, the healthcheck uses it and an unauthenticated request
        # is still refused
        run: |
          docker run -d --name smoke-token ${{ env.IMAGE }}:${{ github.ref_name }}
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke-token 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          mode=$(docker exec smoke-token stat -c '%a' /data/token || echo none)
          anonymous=$(docker exec smoke-token python -c "import urllib.request, urllib.error
          try:
              urllib.request.urlopen('http://127.0.0.1:8420/api/status', timeout=3)
              print('open')
          except urllib.error.HTTPError as e:
              print(e.code)" || echo none)
          docker logs smoke-token 2>&1 | tail -5
          docker rm -f smoke-token
          [ "$status" = "healthy" ] || { echo "::error::never turned healthy ($status)"; exit 1; }
          [ "$mode" = "600" ] || { echo "::error::/data/token has mode $mode"; exit 1; }
          [ "$anonymous" = "401" ] || { echo "::error::an unauthenticated request got $anonymous"; exit 1; }

      - name: Push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Quality-measured video library compressor (ShrinkRay)
          push: true
          provenance: false
