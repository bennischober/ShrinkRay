name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run checks (the gate - ruff, mypy, tests)
        run: tools/gate.sh --no-cov

      - name: Build distributions
        run: uv build

      - name: Extract release notes from CHANGELOG
        run: uv run python tools/release_notes.py "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*

      - name: Upload artifacts (on failure for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  container:
    name: Build, smoke-test and publish the container image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build first WITHOUT pushing: the image must boot and answer the
      # healthcheck before anything reaches the registry (verify the artifact,
      # same rule the encodes follow — a zero exit code is not success)
      - name: Compute the image name (ghcr requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/$(echo ${GITHUB_REPOSITORY#*/} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build the runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Quality-measured video library compressor (ShrinkRay)
          load: true
          provenance: false
          # the toolchain layers (the HandBrake compile, ~4 min) are
          # deterministic given the pinned sources — cache them across runs so
          # a release build is cache-restore + uv sync + copy, not a fresh
          # compile (issue #165)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image (one-shot CLI)
        # the entrypoint is `shrinkray` (issue #242): arguments must reach the
        # CLI, not be appended to `serve`
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ github.ref_name }} --help | grep -q "encode"
          docker run --rm ${{ env.IMAGE }}:${{ github.ref_name }} encode --help | grep -q -- "--dry-run"

      - name: Smoke-test the image (boot + healthcheck)
        run: |
          docker run -d --name smoke \
            -e SHRINKRAY_TOKEN=smoke-test-token \
            ${{ env.IMAGE }}:${{ github.ref_name }}
          # the image's own HEALTHCHECK answers /api/status; wait for it
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "image is healthy"
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::smoke container never turned healthy (status: $status)"
          docker logs smoke 2>&1 | tail -20 || true
          exit 1

      - name: Push the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Quality-measured video library compressor (ShrinkRay)
          push: true
          provenance: false
