name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # one run per ref: a quick sequence of pushes cancels the superseded
  # run instead of executing full parallel pipelines for every push
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.15" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --locked

      # the gate is ONE script (tools/gate.sh), shared with release.yml and
      # the dev image's CMD: the contract lives in one place, not four copies
      - name: Run the gate (lockfile, ruff, mypy both platforms, pytest, import-linter)
        run: tools/gate.sh

      - name: Audit dependencies
        run: uv audit --locked

  ui:
    name: UI (build + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Svelte check
        run: npm run check
        working-directory: ui

      - name: UI unit tests
        run: npm run test
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
