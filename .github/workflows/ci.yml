name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # one run per ref: a quick sequence of pushes cancels the superseded
  # run instead of executing full parallel pipelines for every push
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.15" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (lint + format check)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # mypy's --platform defaults to sys.platform, so a bare `mypy` only checks
      # the host's own view. CI runs on ubuntu, which means a POSIX-only import
      # (pwd, fcntl) would pass here and break a Windows contributor, and the
      # Windows-only os.startfile path would never be checked against the linux
      # deployment target. Check both directions explicitly.
      - name: Run mypy (linux platform)
        run: uv run mypy --platform linux

      - name: Run mypy (win32 platform)
        run: uv run mypy --platform win32

      - name: Run tests with coverage
        run: uv run pytest -q

      # the layers contract (tools -> engine -> server -> cli) is machine-checked,
      # not aspirational: a module in the wrong layer breaks this step, not a
      # review comment
      - name: Run import-linter
        run: uv run lint-imports

      - name: Audit dependencies
        run: uv audit --locked

  ui:
    name: UI (build + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Svelte check
        run: npm run check
        working-directory: ui

      - name: UI unit tests
        run: npm run test
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui
