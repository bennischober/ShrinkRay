name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # one run per ref: a quick sequence of pushes cancels the superseded
  # run instead of executing full parallel pipelines for every push
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.15" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev --locked

      # the gate is ONE script (tools/gate.sh), shared with release.yml and
      # the dev image's CMD: the contract lives in one place, not four copies
      - name: Run the gate (lockfile, ruff, mypy both platforms, pytest, import-linter)
        run: tools/gate.sh

      - name: Audit dependencies
        run: uv audit --locked

  ui:
    name: UI (build + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # cache ~/.npm so `npm ci` reinstalls from local tarballs instead of
          # re-downloading the whole dependency tree on every run
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Svelte check
        run: npm run check
        working-directory: ui

      - name: UI unit tests
        run: npm run test
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      # the dashboard's layout checks (issue #628): every page at 320, 390,
      # 1024 and 1440 px, in dark and light, against a fixture, with no resident app
      # the chromium download is ~150 MB per run; the cache keeps installed
      # browsers across runs, and `playwright install` only fetches revisions
      # missing from the cache, so a stale entry is safe, never wrong
      - name: Restore the Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: Browser checks
        run: npm run test:e2e
        working-directory: ui

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: ui/test-results/screenshots
          if-no-files-found: ignore
