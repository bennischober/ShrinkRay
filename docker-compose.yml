# ShrinkRay's deployment shape (issue #34): one container on a server,
# pointed at a media folder, running unattended.
#
# The library is mounted WRITABLE: the resident app's watch mode encodes in
# place (the encode lands in a staging folder inside the library, is verified,
# and is then swapped in with the original renamed aside as
# <name>.shrinkray-original - never deleted). A read-only mount disables the
# product: the watch loop crashes on its staging folder. --replace is a Mode A
# CLI flag and has nothing to do with the container (issue #198).
#
# Publishing a port means authentication is mandatory (issue #36): leave
# SHRINKRAY_TOKEN unset and the app generates one into ${DATA_DIR}/token on
# first start (issue #249), or set your own - see docs/docker.md.

services:
  shrinkray:
    # the published image (built, smoke-tested and pushed by a v* tag, issue
    # #165). To use it, comment out the build block below and un-comment this:
    # image: ghcr.io/bennischober/shrinkray:latest
    build:
      context: .
      target: runtime
    image: shrinkray:local
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      # required: the app refuses a non-loopback bind without it
      # optional: unset => generated into /data/token on first start
      SHRINKRAY_TOKEN: ${SHRINKRAY_TOKEN:-}
      # a --cpus=4 quota is honoured by the worker plan (issue #34)
      TZ: ${TZ:-UTC}
      # the user every command runs as, and the mask for new files (issue #248):
      # set them to the owner of your library (Unraid: 99 / 100)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      # config.json lives beside the database, on the /data volume
      SHRINKRAY_CONFIG: /data/config.json
      # the watcher's output directory (issue #193). Default: unset => the
      # watcher encodes IN PLACE into the (writable) /media mount. For a
      # read-only /media (test containers, special setups) set it to a
      # writable volume - e.g. SHRINKRAY_WATCH_OUTPUT=/output with the
      # /output mount below; the app validates writability at boot.
      SHRINKRAY_WATCH_OUTPUT: ${SHRINKRAY_WATCH_OUTPUT:-}
    volumes:
      # the library: writable (Mode B encodes in place; see the header)
      - ${MEDIA_DIR:?set MEDIA_DIR to your library folder}:/media
      # the database AND config.json (the app writes config next to the db)
      - ${DATA_DIR:-./data}:/data
      # encoded outputs for the non-replace flow
      - ${OUTPUT_DIR:-./output}:/output
      # probe and verify scratch: sized to the FILM, not to the container layer
      - ${SCRATCH_DIR:-./scratch}:/tmp/shrinkray
    deploy:
      resources:
        limits:
          # keep it explicit: the plan derives workers from the quota
          cpus: "${CPUS:-4}"
    # Docker's default stop grace is 10s; the app's shutdown (issue #431)
    # terminates the running encode/verify child, waits out its kill window
    # and records the job CANCELLED before closing the database - the
    # documented default would SIGKILL the container mid-unwind and lose the
    # CANCELLED write (it is recovered as 'interrupted' on the next boot,
    # but the graceful record is the contract)
    stop_grace_period: 45s
    # no healthcheck block here: the image carries its own HEALTHCHECK (token
    # authenticated, issue #36) and compose inherits it when none is declared
    # — a second copy was one more place to drift.
