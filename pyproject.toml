[project]
name = "shrinkray"
version = "0.4.0"
description = "Catalog your movie library and shrink it with measured, quality-preserving re-encoding."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Benjamin Schober" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
shrinkray = "shrinkray.__main__:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "playwright>=1.64.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.14",
]

[project.urls]
Repository = "https://github.com/bennischober/ShrinkRay"
Issues = "https://github.com/bennischober/ShrinkRay/issues"
Changelog = "https://github.com/bennischober/ShrinkRay/releases"

[tool.uv]
# Supply-chain hardening: skip packages published in the last 7 days so freshly
# poisoned releases don't enter resolution before they are detected and yanked.
exclude-newer = "7 days"
# security fixes are exempt from the cooldown (the audit gate fails otherwise,
# and a known-fixed vulnerability is the exact case the cooldown may delay)
exclude-newer-package = { certifi = false }

[tool.uv.audit]
# Refuse to sync packages with a published malware advisory (OSV MAL database).
malware-check = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrinkray"]
# ship the marker so downstream users get the annotations (PEP 561)
[tool.hatch.build.targets.wheel.force-include]
"src/shrinkray/py.typed" = "shrinkray/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=shrinkray --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

# every module is annotated, so the strict flags above apply to all of them;
# the per-module rollout list is gone (issue #40)

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF",
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501", # line length handled by formatter
    "E741", # ambiguous variable names (dict, l, ...)
    # --- flake8-bandit, reviewed 2026-10-23 ---
    # S603/S607: every subprocess call uses an argument list (never a shell
    # string) and resolves its binary from PATH on purpose, because ffmpeg and
    # HandBrakeCLI are external dependencies the user installs. AGENTS.md
    # mandates argument lists, so there is no untrusted-input path here.
    "S603",
    "S607",
    # S101: asserts inside the encode pipeline are deliberate invariant
    # checks on internal state, not input validation (never used for user input).
    "S101",
    # S324: md5 is used for ETag/change detection on file metadata, not for
    # security. Replacing it with sha256 would cost CPU for no benefit.
    "S324",
    # S105: a false positive - DEFAULT_TOKEN_ENV is the NAME of an environment
    # variable that holds a token, not a token value. The value is never in source.
    "S105",
]

[tool.ruff.lint.per-file-ignores]
# typer.Argument/typer.Option in defaults is the framework's intended usage
"src/shrinkray/__main__.py" = ["B008"]
# FastAPI Depends() in defaults is the framework's intended usage
"src/shrinkray/server/app.py" = ["B008"]
# KNOWN ISSUE, tracked as #43: the Jellyfin notifier calls urlopen on a
# user-configured URL, and a config write can point token_env at any environment
# variable. Remove this ignore together with the integration (issue #43); do not
# add new S310 sites here.
"src/shrinkray/integrations.py" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["shrinkray"]

[tool.coverage.run]
branch = true
source = ["shrinkray"]

[tool.coverage.report]
show_missing = true
# a floor so a regression is a visible failure instead of a slow slide;
# raise it deliberately as coverage improves, never lower it to pass a PR
fail_under = 70

[tool.importlinter]
root_package = "shrinkray"

[[tool.importlinter.contracts]]
name = "Layered architecture (issue #97)"
type = "layers"
layers = [
    "shrinkray.__main__",
    "shrinkray.server",
    "shrinkray.service",
    "shrinkray.engine",
    "shrinkray.tools",
    "shrinkray.db",
    "shrinkray.config",
    "shrinkray.logger",
]
# db.py annotates the timeline crop summary (issue #181) with the engine's
# type under TYPE_CHECKING: an annotation-only edge, no runtime dependency.
ignore_imports = [
    "shrinkray.db -> shrinkray.engine.crop",
]

[[tool.importlinter.contracts]]
name = "Foundation imports nothing internal (issue #97)"
type = "forbidden"
source_modules = [
    "shrinkray.db",
    "shrinkray.config",
    "shrinkray.logger",
    "shrinkray.telemetry",
]
forbidden_modules = [
    "shrinkray.engine",
    "shrinkray.tools",
    "shrinkray.server",
    "shrinkray.service",
    "shrinkray.encode",
    "shrinkray.quality",
    "shrinkray.watch",
    "shrinkray.scanner",
    "shrinkray.helpers",
]
# db.py annotates the timeline crop summary (issue #181) with the engine's
# type under TYPE_CHECKING: an annotation-only edge, no runtime dependency.
ignore_imports = [
    "shrinkray.db -> shrinkray.engine.crop",
]
